name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # snap-stanford is not on PyPI; unit tests do not import it
          grep -vE '^snap-stanford' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install pyright pylint

      - name: Build local cmfrec Cython extensions
        run: cd cmfrec-master && python setup.py build_ext --inplace

      - name: Run unit tests
        env:
          MAFPIN_PYTHON: python
        run: python -m unittest discover -s tests -v

      - name: Pyright (tests + library)
        run: python -m pyright tests recommender pipeline scripts config.py
        continue-on-error: true
