name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright pylint

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Pyright (tests + library)
        run: python -m pyright tests recommender pipeline scripts config.py
        continue-on-error: true
